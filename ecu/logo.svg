<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="t">
  <title id="t">ECU — Engine Control Unit, réseau de connaissance Bony</title>
  <!--
    ECU · Engine Control Unit — circuit imprimé.
    Règle de dessin : aucune piste ne traverse le die. Elles partent toutes de
    son bord vers l'extérieur, en ligne droite, et se terminent sur un via.
    La version précédente les faisait naître à l'intérieur du carré central :
    à 32 px le tout se lisait comme une tache.
    Dégradé charte Bony : #f75632 (Pantone 172 C) -> #8f12ab (Pantone 2602 C).
  -->
  <defs>
    <linearGradient id="bony" x1="96" y1="96" x2="416" y2="416" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f75632"/>
      <stop offset=".5" stop-color="#c1348c"/>
      <stop offset="1" stop-color="#8f12ab"/>
    </linearGradient>
    <linearGradient id="pin" x1="64" y1="64" x2="448" y2="448" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f75632" stop-opacity=".45"/>
      <stop offset="1" stop-color="#8f12ab" stop-opacity=".45"/>
    </linearGradient>
    <radialGradient id="halo" cx="256" cy="256" r="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f75632" stop-opacity=".22"/>
      <stop offset=".6" stop-color="#8f12ab" stop-opacity=".12"/>
      <stop offset="1" stop-color="#8f12ab" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="112" fill="#0a0a12"/>
  <circle cx="256" cy="256" r="200" fill="url(#halo)"/>

  <!-- broches -->
  <g fill="url(#pin)">
    <rect x="208" y="60" width="18" height="30" rx="8"/>
    <rect x="286" y="60" width="18" height="30" rx="8"/>
    <rect x="208" y="422" width="18" height="30" rx="8"/>
    <rect x="286" y="422" width="18" height="30" rx="8"/>
    <rect x="60" y="208" width="30" height="18" rx="8"/>
    <rect x="60" y="286" width="30" height="18" rx="8"/>
    <rect x="422" y="208" width="30" height="18" rx="8"/>
    <rect x="422" y="286" width="30" height="18" rx="8"/>
  </g>

  <!-- pistes : du bord du die vers l'extérieur, aucune ne le traverse -->
  <g stroke="url(#bony)" stroke-width="13" stroke-linecap="round" fill="none">
    <path d="M216 194 V126"/>
    <path d="M256 194 V152"/>
    <path d="M296 194 V126"/>

    <path d="M216 318 V386"/>
    <path d="M256 318 V360"/>
    <path d="M296 318 V386"/>

    <path d="M194 216 H126"/>
    <path d="M194 256 H152"/>
    <path d="M194 296 H126"/>

    <path d="M318 216 H386"/>
    <path d="M318 256 H360"/>
    <path d="M318 296 H386"/>
  </g>

  <!-- vias en bout de piste : les nœuds du réseau -->
  <g fill="url(#bony)">
    <circle cx="216" cy="118" r="17"/>
    <circle cx="296" cy="118" r="17"/>
    <circle cx="216" cy="394" r="17"/>
    <circle cx="296" cy="394" r="17"/>
    <circle cx="118" cy="216" r="17"/>
    <circle cx="118" cy="296" r="17"/>
    <circle cx="394" cy="216" r="17"/>
    <circle cx="394" cy="296" r="17"/>
  </g>

  <!-- le die -->
  <rect x="194" y="194" width="124" height="124" rx="26"
        fill="#0a0a12" stroke="url(#bony)" stroke-width="14"/>
  <rect x="226" y="226" width="60" height="60" rx="14" fill="url(#bony)"/>
</svg>
