<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="tm">
  <title id="tm">ECU — icône masquable (zone de sécurité Android)</title>
  <!-- Fond pleine page, motif ramené dans les 62 % centraux pour qu'aucun
       masque Android ne rogne les pistes. -->
  <defs>
    <linearGradient id="bonyM" x1="80" y1="80" x2="432" y2="432" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f75632"/>
      <stop offset=".5" stop-color="#c1348c"/>
      <stop offset="1" stop-color="#8f12ab"/>
    </linearGradient>
    <linearGradient id="pinM" x1="64" y1="64" x2="448" y2="448" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f75632" stop-opacity=".5"/>
      <stop offset="1" stop-color="#8f12ab" stop-opacity=".5"/>
    </linearGradient>
    <radialGradient id="haloM" cx="256" cy="256" r="190" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f75632" stop-opacity=".24"/>
      <stop offset="1" stop-color="#8f12ab" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="512" height="512" fill="#0a0a12"/>
  <circle cx="256" cy="256" r="190" fill="url(#haloM)"/>

  <g transform="translate(256 256) scale(.62) translate(-256 -256)">
    <g fill="url(#pinM)">
      <rect x="156" y="70" width="16" height="32" rx="7"/>
      <rect x="208" y="70" width="16" height="32" rx="7"/>
      <rect x="288" y="70" width="16" height="32" rx="7"/>
      <rect x="340" y="70" width="16" height="32" rx="7"/>
      <rect x="156" y="410" width="16" height="32" rx="7"/>
